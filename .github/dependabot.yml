version: 2

# Every entry pins commit-message so Dependabot titles its PRs
# `chore(deps): …` / `chore(deps-dev): …` regardless of what it infers from
# history — both scopes are allowlisted in .github/workflows/pr-title-lint.yml,
# and `chore` is exempt from .github/workflows/changelog-check.yml.
#
# Every label used here must exist in the repository (Dependabot silently
# drops unknown labels). They are declared in .github/labels.yml and created
# by .github/workflows/labels.yml.

updates:
  # npm workspaces: root manifest plus sdk, relayer, solver, mempool, test.
  # Dependabot resolves the workspace tree from the root package.json, so a
  # single entry covers all five workspaces' package.json files.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      types:
        patterns:
          - "@types/*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies

  # Soroban (Rust) settlement contract.
  - package-ecosystem: cargo
    directory: "/contracts/soroban"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # Docker images in docker-compose.yml (anvil, stellar/quickstart).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker

  # Actions pinned across ci.yml, coverage.yml, dependency-audit.yml,
  # differential-fuzz.yml, docs.yml, evm.yml, mutation-testing.yml,
  # pr-title-lint.yml, soroban.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - ci
