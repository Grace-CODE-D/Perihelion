name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "contracts/soroban/Cargo.toml"
      - "contracts/soroban/Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/check-npm-audit.mjs"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "contracts/soroban/Cargo.toml"
      - "contracts/soroban/Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/check-npm-audit.mjs"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out and run audit tools.
permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json --audit-level=high > npm-audit.json || true
          node scripts/check-npm-audit.mjs npm-audit.json .github/dependency-audit-allowlist.json

  cargo-audit:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      # cargo-deny only runs `cargo metadata` against the workspace, which still
      # needs a cargo that understands the manifest (resolver 3).
      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master (pinned)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Prebuilt binary: cargo-deny's own MSRV is independent of the project's
      # pinned toolchain, and it does not compile the workspace (#856).
      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny (advisories, licences, bans, sources)
        run: cargo deny --manifest-path contracts/soroban/Cargo.toml --config deny.toml check advisories licenses bans sources
