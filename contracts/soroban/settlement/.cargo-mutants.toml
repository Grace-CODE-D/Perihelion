# cargo-mutants configuration for the Perihelion Soroban settlement contract.
#
# Run locally (from the repository root):
#   cargo install cargo-mutants --locked --version "24.7.1"   # one-time
#   make mutation-soroban
#
# The nightly CI job (.github/workflows/mutation-testing.yml) runs the same
# command, uploads the mutants.out/ report as an artefact, and fails if the
# score drops below the recorded baseline.
#
# See: https://mutants.rs/configuration.html

# Hard timeout per mutant test run (seconds).  Settlement contract tests are
# fast (<5 s normally), so 120 s is generous while still bounding wall-clock.
timeout_multiplier = 3.0

# Focus on the highest-risk modules first.  The codec (messages.rs) is the
# primary serialisation boundary between EVM and Stellar — a silent mutation
# there could corrupt intent identity.  The state-machine logic in lib.rs is
# the settlement critical path.  fuzz.rs and test.rs are excluded because they
# are test/fuzz scaffolding, not production logic.
examine_globs = [
    "src/lib.rs",
    "src/messages.rs",
    "src/types.rs",
    "src/error.rs",
    "src/ttl_archival.rs",
]

# Do not mutate test or fuzz modules — those are helpers, not production logic.
exclude_globs = [
    "src/test.rs",
    "src/fuzz.rs",
    "src/endpoint.rs",
]

# Minimum acceptable mutation score.  cargo-mutants has no native score
# threshold (it exits non-zero on *any* missed mutant), so the baseline lives
# in scripts/check-cargo-mutants-score.mjs, which both `make mutation-soroban`
# and the nightly CI job run against mutants.out/outcomes.json.  Ratchet it up
# as the suite is hardened; track progress in docs/mutation-testing.md.
